project:
  type: website
  render:
    - "*.qmd"
    - "*.Rmd"
    - "*.md"
    - "!README.md"
    - "!LICENSE.md"
    - "!renv/"
  resources:
    - "assets/"
execute:
  freeze: auto # re-render when source changes
  echo: true # show source code in output
  output: true # show results code execution
  cache: false # don't cache code junks by default
description-meta: "Jeremy R. Winget's personal website and blog"
editor:
  markdown:
    wrap: sentence
engine: knitr

website:
  title: "The Friction Point"
  site-url: "https://www.jrwinget.com"
  bread-crumbs: true
  repo-url: https://github.com/jrwinget/website
  description: "Understanding where systems fail, and redesigning them through behavioral science and ethical innovation."
  favicon: /assets/img/logo.png
  cookie-consent: true
  search: true
  open-graph: true
  twitter-card: true
  navbar:
    background: "#f2e9dc"
    logo: /assets/img/logo.png
    title: false
    left:
      - href: blog.qmd
        text: Blog
      - href: research.qmd
        text: Research
      - text: Projects
        menu:
          - href: software.qmd
            text: Software
          - href: talks.qmd
            text: Talks
          - href: courses.qmd
            text: Courses
    right:
      - icon: github
        href: https://github.com/jrwinget
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/jrwinget/
        aria-label: LinkedIn
      - text: "{{< fa brands bluesky >}}"
        href: https://bsky.app/profile/jrwinget.bsky.social
        aria-label: Bluesky
      - text: "{{< fa envelope >}}"
        href: mailto:contact@jrwinget.com
        aria-label: Email
  # sidebar:
  #   - title: "Blog"
  #     contents:
  #       - blog.qmd
  #       - section: "Posts"
  #         contents: "blog/*/index.qmd"
  #   - title: "Research"
  #     contents:
  #       - research.qmd
  #       - section: "Projects"
  #         contents: "research/*/index.qmd"
  #   - title: "Software"
  #     contents:
  #       - software.qmd
  #       - section: "Projects"
  #         contents: "software/*/index.qmd"
  #   - title: "Talks"
  #     contents:
  #       - talks.qmd
  #       - section: "Presentations"
  #         contents: "talks/*/index.qmd"
  #   - title: "Courses"
  #     contents:
  #       - courses.qmd
  #       - section: "Course Materials"
  #         contents: "courses/*/index.qmd"
  page-footer:
    left: |
      {{< fa regular copyright >}} 2025 Jeremy R. Winget • *The Friction Point*<br>
      Made with {{< fa brands r-project >}} and [Quarto](https://quarto.org/)
    right: |
      [License](http://creativecommons.org/licenses/by-nc-sa/4.0/) | [Contact](mailto:contact@jrwinget.com) | [RSS](/blog.xml)
format:
  html:
    code-fold: show
    code-overflow: scroll
    code-line-numbers: true
    theme: [flatly, assets/main.scss]
    css: assets/styles.css
    toc: true
    include-in-header:
      - text: |
          <script defer data-domain="jrwinget.com" src="https://plausible.io/js/script.js"></script>
          <a href="#quarto-content" class="skip-to-main">Skip to main content</a>
    include-after-body:
      - text: |
          <script src="assets/ui-enhancements.js"></script>
    comments:
      utterances:
        repo: jrwinget/website
        issue-term: pathname
        label: comment
        theme: gruvbox-dark
